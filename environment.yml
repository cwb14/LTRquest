name: ltrquest
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - pysam                          # optional: TEGV --bam coverage tracks
  # --- LTR detection ---
  - genometools-genometools=1.6.6   # gt suffixerator / ltrharvest
  - ltr_finder=1.07
  - bedtools=2.31.1
  # --- clustering / alignment (Kmer2LTR, TEsorter2) ---
  - mmseqs2=16.747c6
  - mafft=7.526
  - trimal=1.5.1
  - hmmer=3.4                       # hmmsearch/nhmmer (TEsorter2)
  - blast                           # blastn/makeblastdb (ltrquest-flagfp; TEsorter2 blast pass-2)
  - minimap2                        # TEsorter2 minimap2 pass-2 (PATH lookup); fallback for tools build
  - miniprot                        # protein mapping; fallback if source build fails
  - sdust                           # --run-sdust; found on PATH, so never built
  # --- building the helpers that nobody packages ---
  # TEsorter2 is cloned on first use; TRF-mod is cloned *and* compiled, and it
  # runs by default (--no-trf turns it off). Kmer2LTR is a Python package now:
  # resolved from PATH if it is already installed there, and otherwise cloned
  # to --tools-dir and run via PYTHONPATH -- no compiler involved either way.
  # Without git or a compiler the first real run still dies on
  # `git: not found` or `cc: not found` -- invisible on a workstation that
  # already has build tools, fatal on a clean cluster. TRF-mod's makefile
  # hardcodes CC=gcc, so LTRquest retries the build with CC=$CC, the compiler
  # this environment installs.
  - git
  - make
  - c-compiler                      # provides $CC; TRF-mod and sdust are C
  - zlib                            # -lz, if sdust ever has to be built here
  # --- python libraries ---
  - numpy
  - matplotlib-base
  - pyfaidx                         # ltrquest-flagfp
  - pyhmmer>=0.10                   # TEsorter2
  - pyfastx                         # TEsorter2
  # --- Kmer2LTR's own runtime deps. `parasail` on Bioconda is the C library;
  # the module `import parasail` reaches for lives in `parasail-python` ---
  - parasail-python
  - pywfa
