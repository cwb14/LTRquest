name: ltrquest
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - pysam                          # optional: TEGV --bam coverage tracks
  # --- LTR detection ---
  - genometools-genometools=1.6.6   # gt suffixerator / ltrharvest
  - ltr_finder=1.07
  - bedtools=2.31.1
  # --- clustering / alignment (Kmer2LTR, TEsorter2) ---
  - mmseqs2=16.747c6
  - mafft=7.526
  - trimal=1.5.1
  - hmmer=3.4                       # hmmsearch/nhmmer (TEsorter2)
  - blast                           # blastn/makeblastdb (flag_fp_families; TEsorter2 blast pass-2)
  - minimap2                        # TEsorter2 minimap2 pass-2 (PATH lookup); fallback for tools build
  - miniprot                        # protein mapping; fallback if source build fails
  - sdust                           # --run-sdust; found on PATH, so never built
  # --- building the helpers that nobody packages ---
  # Kmer2LTR and TEsorter2 are cloned on first use; TRF-mod is cloned *and*
  # compiled, and it runs by default (--no-trf turns it off). Without these four
  # the first real run dies on `git: not found` or `cc: not found` -- invisible
  # on a workstation that already has build tools, fatal on a clean cluster.
  # TRF-mod's makefile hardcodes CC=gcc, so LTRquest retries the build with
  # CC=$CC, the compiler this environment installs.
  - git
  - make
  - c-compiler                      # provides $CC; TRF-mod and sdust are C
  - zlib                            # -lz, if sdust ever has to be built here
  # --- python libraries ---
  - biopython
  - numpy
  - matplotlib-base
  - networkx                        # Kmer2LTR ltr_family_network
  - pyfaidx                         # Kmer2LTR flag_fp_families
  - pyhmmer>=0.10                   # TEsorter2
  - pyfastx                         # TEsorter2
