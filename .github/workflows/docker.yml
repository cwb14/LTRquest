name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ltrquest

jobs:
  build:
    name: build and smoke-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Pull requests build but do not publish: a fork must not be able to push
      # an image to the org's registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ltrquest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile already asserts the toolchain during the build. This is
      # the outside-in check: does the published entry point actually run a
      # genome, from a clean working directory, with no network?
      - name: Smoke-test the image
        run: |
          mkdir -p smoke && cd smoke
          zcat ../tests/data/Athal_tair10_chr2.fa.gz \
            | awk 'NR==1 { print ">chr_test"; next } NR <= 8334 { print }' \
            > slice.fa
          printf '>chr_test:1001-2000#LTR/Gypsy/Tekay\nACGT\n' > feats.fa

          run() {
            docker run --rm --network none \
              -v "$PWD:/data" -w /data -u "$(id -u):$(id -g)" ltrquest:ci "$@"
          }

          run ltrquest --help > /dev/null
          run ltrquest-detect --help > /dev/null

          # The entry point is what Apptainer turns into the SIF's runscript, so
          # these are what decide whether `./ltrquest.sif --genome x.fa` works
          # once the image is pulled. 1.0.1 had no ENTRYPOINT and answered the
          # first of them with `"--help": executable file not found`. The driver
          # writes its usage to stderr, hence the redirect.
          run --help 2>&1 | grep -q 'Usage:'
          run ltrquest-gff3 --help > /dev/null
          run --genome /nonexistent.fa 2>&1 | grep -q 'Genome not found'

          # ...and the launcher the README tells people to copy out of the image
          # has to actually be in it, at that path, and be runnable.
          run cat /opt/ltrquest/bin/ltrquest-container > launcher.sh
          sh -n launcher.sh
          grep -q 'apptainer pull' launcher.sh

          # The detector resolves its helper binaries before it does any work.
          # `--help` never reaches that code, so a v1.0.0 image shipped unable to
          # run a genome at all: ensure_tools tried to `git clone` minimap2, and
          # the runtime image has no git on purpose. Assert resolution here --
          # offline, in the published layout -- so that cannot recur.
          run python -c "
          from pathlib import Path
          from ltrquest.detect import ensure_tools
          mm2, mp = ensure_tools(Path('/opt/ltrquest/tools'))
          print('minimap2:', mm2); print('miniprot:', mp)
          "

          run ltrquest-mask \
            --features-fasta feats.fa --genome slice.fa \
            --feature-character N --far-character V --distance 15000 \
            > masked.fa

          # 1000 masked bases where the feature was, and the sequence is intact.
          python3 - <<'EOF'
          seq = "".join(l.strip() for l in open("masked.fa") if not l.startswith(">"))
          assert seq[1000:2000] == "N" * 1000, "feature not masked"
          assert len(seq) == len("".join(l.strip() for l in open("slice.fa") if not l.startswith(">")))
          print("masking correct; image runs with --network none")
          EOF

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
